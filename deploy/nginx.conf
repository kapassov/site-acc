# Non-Docker production config for the current storefront domain.
# Docker Compose uses nginx.conf.template instead, with SITE_DOMAIN envsubst.
proxy_cache_path /var/cache/nginx/inkar-media levels=1:2 keys_zone=inkar_media:20m
                 max_size=2g inactive=30d use_temp_path=off;

server {
    listen 80;
    server_name apteka-demo.quasar-it.kz;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# Keep old IP bookmarks working without presenting a mismatched TLS certificate.
server {
    listen 80 default_server;
    server_name 90.156.222.185 _;
    return 301 https://apteka-demo.quasar-it.kz$request_uri;
}

server {
    listen 443 ssl;
    server_name apteka-demo.quasar-it.kz;

    ssl_certificate     /etc/letsencrypt/live/apteka-demo.quasar-it.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apteka-demo.quasar-it.kz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 30m;

    # Product images are immutable Medusa /static assets. Cache the same-origin
    # WebP proxy on disk so application restarts do not re-download and
    # transcode the same SKU image.
    location = /api/media/medusa {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Never preserve a caller-supplied forwarding chain. The application
        # trusts only the address authenticated by this reverse proxy.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache inkar_media;
        proxy_cache_key "$scheme|$request_method|$host|$request_uri|$http_accept";
        proxy_cache_valid 200 7d;
        proxy_cache_valid 404 10m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        add_header X-Proxy-Cache $upstream_cache_status always;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location = /sw.js {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
